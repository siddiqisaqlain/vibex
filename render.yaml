# Render blueprint: render.com -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: vibex
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/products
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: OWNER_KEY          # unlocks /demo?key=... and the owner controls
        generateValue: true
      - key: ANTHROPIC_API_KEY  # optional: lets AI read product photos
        sync: false
      - key: DESIGN             # empty = current surplus design; v2 dark, v3 colourful, v4 mix
        sync: false
