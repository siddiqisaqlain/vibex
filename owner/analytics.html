<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<title>Vibe X Analytics</title>
<style>
  /* The shop's own look: warm paper, ink, one signal red. Red only ever means trouble, green only ever means a sale. */
  :root{color-scheme:light;--paper:#f4f2ee;--card:#fbfaf8;--ink:#121212;--ink2:#3d3c39;--mute:#6b6963;--line:rgba(18,18,18,.13);--wall:#121212;--hover:#ebe8e2;
    --water:#2f7ea6;--waterRim:#9fd0e6;--red:#e2382c;--redText:#b9271c;--redBg:#f9e6e1;--green:#1f7a52;--greenBg:#e3f0e9;--path:#121212;--neutral:#a5a297;--neutral2:#d3cfc6;
    --h0:#ebe8e2;--h1:#d3cfc6;--h2:#a5a297;--h3:#6b6963;--h4:#3d3c39;--h5:#121212;
    --mono:"Geist Mono",ui-monospace,Menlo,monospace}
  @media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;--paper:#141312;--card:#1c1b19;--ink:#f2f0ea;--ink2:#c9c6bd;--mute:#9b988f;--line:rgba(255,255,255,.14);--wall:#c9c6bd;--hover:#272522;
    --water:#3f97c4;--waterRim:#a9dcf2;--red:#f0604f;--redText:#f58a7c;--redBg:#33201c;--green:#4fbe86;--greenBg:#17291f;--path:#f2f0ea;--neutral:#79766e;--neutral2:#46443f;
    --h0:#272522;--h1:#46443f;--h2:#6b6963;--h3:#9b988f;--h4:#c9c6bd;--h5:#f2f0ea}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.4 "Schibsted Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  button,input,select{font:inherit;color:inherit}
  .hide{display:none!important}
  .m{font-family:var(--mono);letter-spacing:-.01em}
  header.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header.top h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.02em}
  header.top a{color:var(--mute);font:12px var(--mono)}
  .pill{display:inline-flex;align-items:center;gap:7px;font:500 13px var(--mono)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
  .dot.off{background:var(--red);animation:none}
  @keyframes pulse{50%{opacity:.35}}
  .range{margin-left:auto;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
  .range button,.chips button{border:1px solid var(--line);background:none;border-radius:3px;padding:6px 10px;min-height:36px;cursor:pointer;font:12px var(--mono);color:var(--ink2)}
  .range button.on,.chips button.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
  .range input{background:none;border:1px solid var(--line);border-radius:3px;padding:5px 6px;font:12px var(--mono);min-height:36px}
  nav.tabs{background:var(--paper);border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;padding:0 12px;position:sticky;top:57px;z-index:4;scrollbar-width:none}
  nav.tabs button{border:0;background:none;padding:12px 12px;min-height:44px;font-weight:600;color:var(--mute);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
  nav.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
  main{padding:16px 20px 60px;max-width:1180px;margin:0 auto}
  section.view{display:none}section.view.on{display:block}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:14px 16px;min-width:0;margin-bottom:14px}
  .grid>.card{margin-bottom:0}
  .card h2{margin:0 0 10px;font-size:15px;font-weight:700;letter-spacing:-.01em}
  .cardHead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .empty{color:var(--mute);font-size:14px;padding:18px 4px;text-align:center}
  svg{display:block;width:100%;height:auto}
  svg text{font-family:var(--mono)}
  /* the numbers, always one tap away */
  details.more{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
  details.more>summary{cursor:pointer;font:12px var(--mono);color:var(--mute);min-height:28px;display:flex;align-items:center;gap:6px;list-style:none}
  details.more>summary::-webkit-details-marker{display:none}
  details.more>summary::before{content:"+";font-weight:600}details.more[open]>summary::before{content:"−"}
  .csv{border:1px solid var(--line);background:none;border-radius:3px;font:11px var(--mono);padding:3px 8px;cursor:pointer;color:var(--ink2);margin:6px 0}
  .scroll{overflow-x:auto}
  table{border-collapse:collapse;width:100%;min-width:520px;font-size:13.5px}
  th{font:11px var(--mono);color:var(--mute);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:0}
  td.n,th.n{text-align:right;font-family:var(--mono);font-size:12.5px}
  tbody tr:hover{background:var(--hover)}
  .tag{font:11px var(--mono);padding:1px 6px;border-radius:2px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
  .tag.bad{color:var(--redText);border-color:var(--red)}
  /* the water floor */
  .waterBox{position:relative;touch-action:pan-y}
  #waterCv{display:block;width:100%}
  .planHead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .bigNow{font:600 44px/1 var(--mono);letter-spacing:-.04em}
  .planHead .say{font-size:14px;color:var(--ink2);flex:1 1 180px}
  .chips{display:flex;gap:4px;flex-wrap:wrap}
  .key{display:flex;gap:14px;flex-wrap:wrap;font:11px var(--mono);color:var(--mute);margin-top:8px}
  .key i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;background:var(--ink)}
  .key i.w{background:var(--water)}
  .key i.r{background:var(--red)}.key i.g{background:var(--green)}.key i.l{background:none;border-radius:0;height:3px;width:16px;vertical-align:3px;background:var(--path);opacity:.3}
  .deck{display:flex;align-items:center;gap:10px;margin-top:10px}
  .deck button{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);cursor:pointer;font-size:15px}
  .deck .rail{flex:1;min-width:0;position:relative}
  .deck .rail svg{height:34px}
  .deck input{position:absolute;inset:auto 0 -6px 0;width:100%;margin:0;accent-color:var(--ink)}
  .deck time{font:12px var(--mono);min-width:66px;text-align:right}
  #whoBox{font-size:13.5px;color:var(--ink2);min-height:22px;margin-top:8px}
  .ticker{font-size:13.5px;margin:0;padding:0;list-style:none}
  .ticker li{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}.ticker li:last-child{border:0}
  .ticker time{font:11px var(--mono);color:var(--mute);flex:none;padding-top:2px;min-width:58px}
  .ticker li.bad{color:var(--redText)}.ticker li.good{color:var(--green);font-weight:600}
  /* river, verdict */
  .leakHead{font-size:clamp(20px,3.4vw,30px);font-weight:700;letter-spacing:-.025em;line-height:1.15;margin:0 0 4px}
  .leakFix{color:var(--ink2);margin:0 0 12px;font-size:14px}
  .band{fill:var(--ink)}.band:hover{opacity:.85}
  .leak{fill:var(--red);opacity:.38}.leak.worst{opacity:1}.leak:hover{opacity:.8}
  .rv{font-size:12px;fill:var(--mute)}.rvb{font-size:20px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:5px;stroke-linejoin:round}
  .rvs{font-size:11px;fill:var(--ink2);paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
  .rvl{font-size:13px;font-weight:600;fill:var(--redText)}
  .rain{fill:var(--green)}
  .pins{display:flex;flex-direction:column;gap:6px}
  details.pin{border-radius:3px;padding:7px 10px;font-size:14px}
  details.pin>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-weight:600}
  details.pin>summary::-webkit-details-marker{display:none}
  details.pin.bad{background:var(--redBg)}details.pin.good{background:var(--greenBg)}
  details.pin p{margin:4px 0 0 20px;font-size:13px;color:var(--ink2)}
  .ic{flex:none;font:600 12px var(--mono)}.bad>summary .ic{color:var(--redText)}.good>summary .ic{color:var(--green)}
  /* each dot is one person */
  .unit{margin-bottom:9px}.unit .l{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}.unit .l span{font:12px var(--mono);color:var(--mute);flex:none}
  .unit .ds{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
  .unit .ds i{width:9px;height:9px;border-radius:50%;background:var(--red)}
  .unit .ds.ink i{background:var(--ink)}
  .seg{display:flex;gap:2px;height:44px}
  .seg>div{display:flex;align-items:center;justify-content:center;min-width:3px;color:#fff;font-size:20px;overflow:hidden}
  .seg>div:first-child{border-radius:4px 0 0 4px}.seg>div:last-child{border-radius:0 4px 4px 0}
  .segKey{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12.5px;margin-top:8px;color:var(--ink2)}
  .segKey i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
  .segKey b{font-family:var(--mono);font-weight:500}
  .bub{background:var(--hover);border-radius:10px 10px 10px 2px;padding:8px 11px;margin-bottom:8px;max-width:560px}
  .bub p{margin:0 0 2px;font-size:14px}.bub small{color:var(--mute);font:11px var(--mono)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .row input{padding:9px 10px;border:1px solid var(--line);border-radius:3px;background:var(--card);min-height:40px}
  .row input[type=text]{flex:1 1 240px}
  .primary{border:0;background:var(--ink);color:var(--paper);font-weight:700;padding:9px 14px;border-radius:3px;cursor:pointer;min-height:40px}
  .plain{border:0;background:none;color:var(--mute);cursor:pointer;font-size:12px;text-decoration:underline;padding:4px}
  .chg{border-top:1px solid var(--line);padding:10px 0}
  .ba{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 18px;margin-top:8px}
  .pair{font-size:12.5px;color:var(--ink2)}
  .pair .t{height:7px;background:var(--neutral);border-radius:0 4px 4px 0;margin-top:3px;min-width:2px}.pair .t.now{background:var(--ink)}
  .pair small{font:11px var(--mono);color:var(--mute);display:block;margin-top:2px}
  .sub2{font:12px var(--mono);color:var(--mute)}
  /* an opened room */
  .rt{font-size:21px;letter-spacing:-.02em;margin:0}
  .facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
  .fact{border:1px solid var(--line);border-radius:3px;padding:8px 10px}
  .fact small{display:block;font:11px var(--mono);color:var(--mute)}
  .fact b{display:block;font:600 19px var(--mono);letter-spacing:-.03em}
  .fact i{display:block;font:normal 10.5px var(--mono);color:var(--mute)}
  .h3{font:12px var(--mono);color:var(--mute);margin:0 0 6px;font-weight:500}
  .touch{margin-top:12px}.touch h3{font:12px var(--mono);color:var(--mute);margin:0 0 6px;font-weight:500}
  .tgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:1px;max-width:190px;aspect-ratio:10/16;border:1px solid var(--line)}
  .pinFix{background:var(--redBg);padding:8px 10px;border-radius:3px;margin-top:8px;font-size:14px}.pinFix b{display:block}.pinFix span{font:12px var(--mono);color:var(--ink2)}
  /* fix first */
  .fix{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
  .fix .no{font:600 18px var(--mono);color:var(--mute)}
  .fix b{font-size:15.5px}.fix p{margin:2px 0 6px;font-size:13.5px;color:var(--ink2)}
  .fix .tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .fix .val{text-align:right}.fix strong{display:block;font:600 19px var(--mono);letter-spacing:-.03em}.fix small{font:11px var(--mono);color:var(--mute)}
  .fix.maybe{opacity:.72}
  .tag.good{color:var(--green);border-color:var(--green)}
  .seg-pick{background:none;border:1px solid var(--line);border-radius:3px;padding:6px 8px;min-height:36px;font:12px var(--mono);color:var(--ink2);max-width:150px}
  /* the order form, box by box */
  .chain{display:flex;gap:2px;margin:6px 0 4px}
  .chain>div{min-width:64px;padding:8px 10px;color:var(--paper);background:var(--h4);font-size:12.5px;overflow:hidden}
  .chain>div:first-child{border-radius:4px 0 0 4px;background:var(--h3)}.chain>div:last-child{border-radius:0 4px 4px 0;background:var(--h5)}
  .chain b{display:block;font:600 19px var(--mono);letter-spacing:-.03em}
  .fb{border:1px solid var(--line);border-radius:3px;padding:9px 11px;margin-bottom:8px;position:relative;overflow:hidden;background:var(--card)}
  .fb .sh{position:absolute;inset:0 auto 0 0;background:var(--ink);opacity:.07}
  .fb>div{position:relative}
  .fb .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-weight:600}
  .fb .top span{font:600 16px var(--mono)}
  .fb .sub2{margin-top:2px;display:flex;flex-wrap:wrap;gap:3px 12px}
  .fb .sub2 b{font-weight:500;color:var(--redText)}
  /* traffic */
  .heroes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .hero{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:12px 16px}
  .hero small{display:block;font:12px var(--mono);color:var(--mute)}
  .hero b{display:block;font:600 clamp(24px,4.4vw,38px)/1.15 var(--mono);letter-spacing:-.04em}
  .hero i{font:normal 12px var(--mono);color:var(--mute)}.hero i.up{color:var(--green)}.hero i.dn{color:var(--redText)}
  .heat{display:grid;grid-template-columns:34px repeat(24,minmax(10px,1fr));gap:2px;font:10px var(--mono);color:var(--mute);min-width:520px}
  .heat div.c{aspect-ratio:1.4;border-radius:2px}
  .scale{display:flex;align-items:center;gap:3px;font:11px var(--mono);color:var(--mute);margin-top:8px}
  .scale i{width:18px;height:10px;border-radius:2px;display:block}
  .src{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 92px;gap:10px;align-items:center;padding:6px 0;font-size:14px}
  .src .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .src .tr{height:14px;display:flex;gap:2px}
  .src .all{background:var(--neutral);border-radius:0 4px 4px 0}.src .buy{background:var(--green);min-width:3px}
  .src .val{text-align:right;font:12px var(--mono);color:var(--ink2)}
  .bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:4px 0;font-size:13.5px}
  .bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar .val{font:12px var(--mono);color:var(--ink2)}
  .bar .track{grid-column:1/-1;height:6px}
  .bar .fill{display:block;height:6px;min-width:2px;border-radius:0 4px 4px 0;background:var(--ink)}
  /* phones */
  .phones{display:flex;gap:26px;flex-wrap:wrap;justify-content:center}
  .phoneWrap{flex:0 1 230px;min-width:0}.phoneWrap h3{font:12px var(--mono);color:var(--mute);margin:0 0 6px;text-align:center;font-weight:500}
  .phone{border:2px solid var(--ink);border-radius:26px;padding:12px 6px 16px;background:var(--card);position:relative}
  .phone::before{content:"";display:block;width:44px;height:4px;border-radius:2px;background:var(--ink);margin:0 auto 8px}
  .phone .s{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:0 9px;font-size:12px;min-height:44px}
  .phone .s:first-of-type{border-radius:12px 12px 0 0}.phone .s:last-of-type{border-radius:0 0 12px 12px}
  .phone .s span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.phone .s b{font:500 11px var(--mono);flex:none}
  .speed{position:relative;height:56px;margin-top:6px}
  .speed .z{position:absolute;top:30px;height:8px;border-radius:2px}
  .speed .pin{position:absolute;top:0;transform:translateX(-50%);font:11px var(--mono);white-space:nowrap}
  .speed .pin::after{content:"";display:block;width:2px;height:22px;background:var(--ink);margin:1px auto 0}
  .speed .pin.l{transform:translateX(calc(-100% + 1px))}.speed .pin.l::after{margin-left:auto;margin-right:0}.speed .pin.r{transform:translateX(-1px)}.speed .pin.r::after{margin-left:0}
  .speed .tick{position:absolute;top:42px;transform:translateX(-50%);font:10px var(--mono);color:var(--mute)}
  /* product map */
  .pm{position:relative;height:440px;margin:6px 0 24px 22px;border-left:1px solid var(--line);border-bottom:1px solid var(--line)}
  .pm .mid{position:absolute;background:var(--line)}
  .pm .q{position:absolute;font:11px var(--mono);color:var(--mute);padding:6px;pointer-events:none}
  .pm .ax{position:absolute;font:11px var(--mono);color:var(--mute)}
  .pb{position:absolute;transform:translate(-50%,-50%);border-radius:50%;padding:0;border:2px solid var(--card);background:var(--hover);overflow:hidden;cursor:pointer;display:grid;place-items:center;font:600 13px var(--mono);color:var(--ink2);box-shadow:0 0 0 1px var(--line)}
  .pb img{width:100%;height:100%;object-fit:cover;display:block}
  .pb.sold{box-shadow:0 0 0 2px var(--green)}.pb.cold{box-shadow:0 0 0 2px var(--red)}.pb.sel{outline:2px solid var(--ink);outline-offset:2px}
  #pDetail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px;align-items:center}
  #pDetail h3{margin:0;font-size:18px;letter-spacing:-.02em}
  /* visits as threads */
  .thr{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;align-items:center;padding:4px 2px;cursor:pointer;border-bottom:1px solid var(--line);min-height:32px}
  .thr:hover{background:var(--hover)}
  .thrs{columns:2;column-gap:28px}.tw{break-inside:avoid}
  .thr time{font:11px var(--mono);color:var(--mute)}
  .beads{display:flex;align-items:center;gap:0;overflow:hidden}
  .beads i{flex:none;width:11px;height:11px;border-radius:50%;background:var(--neutral);margin-right:7px;position:relative}
  .beads i:not(:last-child)::after{content:"";position:absolute;left:11px;top:5px;width:7px;height:1px;background:var(--neutral)}
  .beads i.pr{background:var(--ink)}.beads i.co{background:var(--ink);border-radius:2px}
  .beads i.bad{background:var(--red);border-radius:2px;transform:rotate(45deg)}.beads i.bad::after{display:none}
  .beads i.good{background:var(--green);width:15px;height:15px}
  .where{display:flex;gap:2px;height:14px;margin:4px 0 2px}
  .where i{display:block;min-width:3px}.where i:nth-child(3n+1){background:var(--h5)}.where i:nth-child(3n+2){background:var(--h3)}.where i:nth-child(3n){background:var(--h2)}
  .where i:first-child{border-radius:3px 0 0 3px}.where i:last-child{border-radius:0 3px 3px 0}
  .journey{list-style:none;margin:0;padding:6px 0 6px 12px;border-left:2px solid var(--line)}
  .vd{padding:4px 0 8px 70px;font-size:13px}
  .vd .sub2{display:block;margin-bottom:4px}
  .journey li{padding:2px 0;font-size:13.5px}.journey time{color:var(--mute);font:11px var(--mono);margin-right:8px}
  .journey li.bad{color:var(--redText);font-weight:600}.journey li.good{color:var(--green);font-weight:600}
  #tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12.5px;padding:5px 9px;border-radius:3px;z-index:20;white-space:nowrap;transform:translate(-50%,-120%)}
  #lock{position:fixed;inset:0;z-index:30;background:var(--paper);display:grid;place-items:center;padding:16px}
  #lock form{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:22px;width:min(380px,100%)}
  #lock h2{margin:0 0 6px}#lock input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:3px;margin:8px 0;background:var(--card)}

  // The funnel as a river: its width is people, and what leaves it falls away in red.

      ${card("", `${trendChart(d)}${more(table("totals", [{ h: "Measure", k: "a" }, { h: "Value", k: "b", n: 1 }], allRows), "All the totals")}`)}
      ${card("The week's rhythm", heatmap(d))}
      ${card("Who comes, and who buys", `${sourceRows(d.sources)}${more(`${table("sources", group("Source"), d.sources, "No visits yet.")}${table("devices", group("Device"), d.devices, "No visits yet.")}<div class="grid" style="margin-top:12px"><div><h2>Browsers</h2>${bars(d.browsers)}</div><div><h2>Phones and computers</h2>${bars(d.systems)}</div><div><h2>Languages</h2>${bars(d.languages)}</div><div><h2>Time zones</h2>${bars(d.places)}</div><div><h2>Other sites and campaigns</h2>${bars([...d.campaigns.map((r) => ({ ...r, label: `Campaign: ${r.key}` })), ...d.referrers])}</div></div>`, "Sources, devices, browsers and more")}`)}`);
  }

  // ---- scroll map ----
  const inkOn = (level) => (level >= 3 ? "var(--paper)" : "var(--ink)");
  function phone(title, rows) { // rows: {label, share 0-100, n}
    const level = (s) => Math.min(5, Math.floor(s / 20) + (s > 0 ? 1 : 0));
    return `<div class="phoneWrap"><h3>${esc(title)}</h3><div class="phone">${rows.map((r) => { const l = level(r.share); return `<div class="s" style="background:var(--h${l});color:${inkOn(l)};min-height:${Math.round(320 / Math.max(rows.length, 1))}px" data-tip="${esc(r.label)}: ${num(r.n)} people, ${r.share}%${r.time ? `, typically ${esc(dur(r.time))}` : ""}"><span>${esc(r.label)}</span><b>${r.time ? `${esc(dur(r.time))} · ` : ""}${r.share}%</b></div>`; }).join("")}</div></div>`;
  }
  function speedGauge(s) {
    if (!s.n) return `<p class="empty">No data yet.</p>`;
    const max = 8000, pc = (ms) => Math.min(100, (ms / max) * 100);
    return `<div class="speed"><span class="z" style="left:0;width:${pc(2500)}%;background:var(--green)"></span><span class="z" style="left:${pc(2500)}%;width:${pc(1500)}%;background:var(--neutral)"></span><span class="z" style="left:${pc(4000)}%;width:${100 - pc(4000)}%;background:var(--red)"></span>
      <span class="pin l" style="left:${pc(s.median)}%">typical ${(s.median / 1000).toFixed(1)}s</span><span class="pin r" style="left:${Math.min(70, pc(s.slow))}%">slowest 1 in 4: ${(s.slow / 1000).toFixed(1)}s</span>
      ${[0, 2, 4, 6, 8].map((v) => `<span class="tick" style="left:${Math.max(1, Math.min(98, v * 12.5))}%">${v}s</span>`).join("")}</div>`;
  }
  function renderBehave(d) {
    const A = { wa: "Went to WhatsApp", ig: "Went to Instagram", map: "Opened directions", call: "Pressed call", video: "Played the video", yt: "Went to YouTube", filter: "Used a filter", copy: "Copied payment details", enq_open: "Opened enquiry", enq: "Sent an enquiry" };
    const acts = Object.entries(d.acts).map(([k, n]) => ({ label: A[k] || k, n })).sort((a, b) => b.n - a.n);
    const S = ["Quarter way", "Halfway", "Three quarters", "To the end"];
    const base = (page) => Math.max(1, d.pages.filter((p) => (page === "Home page" ? p.path === "/" : p.path.startsWith("/p/"))).reduce((n, p) => n + p.visits, 0));
    const homeTime = Object.fromEntries((d.zones?.home || []).map((z) => [z.key, z.medianTime]));
    const home = d.sections.map((s) => ({ label: s.label, n: s.n, share: Math.min(100, Math.round(s.share)), time: homeTime[s.key] }));
    const pz = d.zones?.product || [];
    const prod = pz.length ? pz.map((z) => ({ label: z.label, n: z.people, share: Math.min(100, Math.round((z.people / base("Product page")) * 100)), time: z.medianTime }))
      : (d.scroll["Product page"] || []).map((n, i) => { const b = base("Product page"); return { label: S[i], n, share: Math.min(100, Math.round((n / b) * 100)) }; });
    const zoneRows = [...(d.zones?.home || []).map((z) => ({ ...z, page: "Home page" })), ...pz.map((z) => ({ ...z, page: "Product pages" }))];
    const OUT = { Paid: "var(--green)", "Left checkout": "var(--red)", Enquired: "var(--ink)", "Browsed products": "var(--neutral)", "Looked around": "var(--neutral2)" };
    keepOpen($("v-behave"), `${card("How far down people get", `${d.sections.length ? `<div class="phones">${phone("Home page", home)}${prod.some((r) => r.n) ? phone("Product pages", prod) : ""}</div><div class="scale" style="justify-content:center">Few reach it ${[1, 2, 3, 4, 5].map((i) => `<i style="background:var(--h${i})"></i>`).join("")} Everyone</div>${zoneRows.length ? more(table("zones", [{ h: "Page", k: "page" }, { h: "Section", k: "label" }, { h: "People", k: "people", n: 1 }, { h: "Typical time", f: (r) => dur(r.medianTime), n: 1 }, { h: "Total time", f: (r) => dur(r.totalTime), n: 1 }], zoneRows)) : ""}` : `<p class="empty">No data yet.</p>`}`)}
      ${card("How each visit ended", d.outcomes.length ? segments(d.outcomes.map((o) => ({ label: o.key, n: o.n, c: OUT[o.key] || "var(--neutral)" }))) : `<p class="empty">No data yet.</p>`)}
      <div class="grid">${card("What they press", bars(acts))}${card("What they hunt for", bars(d.filters))}</div>
      ${card("Everything they pressed", `${bars((d.presses || []).slice(0, 10).map((r) => ({ label: r.label, n: r.n })))}${d.presses?.length ? more(table("presses", [{ h: "Button or link", k: "label" }, { h: "Presses", k: "n", n: 1 }, { h: "People", k: "people", n: 1 }], d.presses), "See all of them") : ""}`)}
      ${card("How fast it loads", `${speedGauge(d.speed)}${d.speed.n ? `<p class="sub2">${num(d.speed.n)} page loads measured.</p>` : ""}${d.vitals?.lcp.n ? `<div class="facts" style="margin-top:12px">${fact("Main content appears", `${(d.vitals.lcp.median / 1000).toFixed(1)}s`, "good is under 2.5s")}${fact("Slowest 1 in 4", `${(d.vitals.lcp.p75 / 1000).toFixed(1)}s`)}${fact("Answers a press in", `${Math.round(d.vitals.inp.median)}ms`, "good is under 200ms")}${fact("Page jumps around", (d.vitals.cls.median / 1000).toFixed(2), "good is under 0.10")}${fact("Server replies in", `${Math.round(d.vitals.ttfb.median)}ms`)}</div>` : ""}${d.networks?.length ? `<div class="grid" style="margin:12px 0 0"><div><h3 class="h3">Their connection</h3>${bars(d.networks.map((r) => ({ label: r.key.toUpperCase(), n: r.n })))}</div><div><h3 class="h3">Their screen</h3>${bars(d.screens)}</div></div>` : ""}`)}
      ${card("Every page", more(table("pages", [{ h: "Page", k: "label" }, { h: "Views", k: "views", n: 1 }, { h: "People", k: "visits", n: 1 }, { h: "Avg time", f: (r) => dur(r.avgTime), n: 1 }, { h: "Arrived here", k: "lands", n: 1 }, { h: "Left from here", k: "exits", n: 1 }, { h: "Left rate", f: (r) => `${r.exitRate}%`, n: 1 }], d.pages, "No visits yet.")))}`);
  }

  // ---- products: the shelf map ----
  let catalog = null;
  async function getCatalog() {
    if (catalog) return catalog;
    try { const r = await fetch("/api/products"); const list = await r.json(); catalog = Object.fromEntries(list.map((p) => [p.id, p])); } catch { catalog = {}; }
    return catalog;
  }
  function productDetail(p) {
    const box = $("pDetail"); if (!box || !p) return;
    const top = Math.max(p.seen || 0, p.views, 1);
    box.innerHTML = `<div><h3>${esc(p.name)}</h3><p class="sub2">${inr(p.value)} · ${dur(p.avgTime)} on its page · ${p.seen ? `${dur(p.seenTime)} on screen in the rack · ${p.tapRate}% of those who saw it tapped · ` : ""}${p.enq} enquiries · ${p.chat} chats</p></div><div>${bars([{ label: "Saw it in the rack", n: p.seen || 0 }, { label: "Opened it", n: p.views }, { label: "Pressed Order now", n: p.checkout }, { label: "Bought", n: p.paid }], { max: top })}</div>`;
    document.querySelectorAll(".pb").forEach((b) => b.classList.toggle("sel", b.dataset.p === p.id));
  }
  async function renderProducts(d) {
    const cat = await getCatalog();
    const list = d.products.filter((p) => p.views > 0);
    const tableHtml = table("products", [{ h: "Product", k: "name" }, { h: "Saw it", k: "seen", n: 1 }, { h: "On screen", f: (r) => dur(r.seenTime), n: 1 }, { h: "Tapped", f: (r) => `${r.tapRate}%`, n: 1 }, { h: "People viewed", k: "views", n: 1 }, { h: "Avg time", f: (r) => dur(r.avgTime), n: 1 }, { h: "Pressed Order", k: "checkout", n: 1 }, { h: "Left checkout", k: "abandon", n: 1 }, { h: "Enquiries", k: "enq", n: 1 }, { h: "Chats", k: "chat", n: 1 }, { h: "Orders", k: "paid", n: 1 }, { h: "Value", f: (r) => inr(r.value), n: 1 }, { h: "Viewed to order", f: (r) => `${r.conv}%`, n: 1 }], d.products, "No product views yet.");
    if (!list.length) { $("v-products").innerHTML = card("The shelf map", `<p class="empty">No product views yet.</p>`); return; }
    const Vmax = Math.max(...list.map((p) => p.views)), Vmin = Math.min(...list.map((p) => p.views)), Vfloor = Math.max(0, Vmin - (Vmax - Vmin || Vmax) * 0.15), vx = (v) => ((v - Vfloor) / Math.max(1, Vmax - Vfloor)) * 90 + 5, Cmax = Math.max(...list.map((p) => p.conv), 5), Hmax = Math.max(...list.map((p) => p.value), 1);
    const sorted = (k) => [...list].map((p) => p[k]).sort((a, b) => a - b), med = (k) => sorted(k)[Math.floor(list.length / 2)];
    const mx = vx(med("views")), my = 100 - ((med("conv") / Cmax) * 88 + 6);
    // spread out any photos that land on each other; hover still gives the true numbers
    const bw = Math.min($("v-products").clientWidth || innerWidth, 1140) - 70, bh = innerWidth < 860 ? 380 : 440;
    const small = bw < 500 ? 0.66 : 1; // room for every photo on a phone
    const dots = list.map((p) => ({ p, r: (19 + Math.sqrt(p.value / Hmax) * 21) * small, x: (vx(p.views) / 100) * bw, y: (100 - ((p.conv / Cmax) * 88 + 6)) / 100 * bh }));
    for (let it = 0; it < 40; it++) for (let i = 0; i < dots.length; i++) for (let j = i + 1; j < dots.length; j++) {
      const a = dots[i], b = dots[j], dx = b.x - a.x, dy = b.y - a.y, gap = a.r + b.r + 3, dist = Math.hypot(dx, dy) || 1;
      if (dist < gap) { const push = (gap - dist) / 2, ux = dx / dist, uy = dy / dist; a.x -= ux * push; a.y -= uy * push; b.x += ux * push; b.y += uy * push; }
    }
    for (const q of dots) { q.x = Math.max(q.r, Math.min(bw - q.r, q.x)); q.y = Math.max(q.r, Math.min(bh - q.r, q.y)); }
    const pb = (q) => { const c = cat[q.p.id], m = q.p; const word = m.paid ? "sold" : m.views >= 10 && !m.checkout ? "cold" : ""; return `<button type="button" class="pb ${word}" data-p="${esc(m.id)}" aria-label="${esc(m.name)}" data-tip="${esc(m.name)}: ${m.views} looked, ${m.paid} bought" style="left:${(q.x / bw) * 100}%;top:${(q.y / bh) * 100}%;width:${q.r * 2}px;height:${q.r * 2}px">${c?.image ? `<img src="${esc(c.image)}" alt="" loading="lazy">` : esc((m.name || "?").split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toUpperCase())}</button>`; };
    keepOpen($("v-products"), `${card("The shelf map", `<div class="pm"><span class="mid" style="left:${mx}%;top:0;bottom:0;width:1px"></span><span class="mid" style="top:${my}%;left:0;right:0;height:1px"></span>
        <span class="q" style="left:0;top:0">Hidden gems</span><span class="q" style="right:0;top:0;text-align:right">Stars</span><span class="q" style="left:0;top:${my}%">Quiet</span><span class="q" style="right:0;top:${my}%;text-align:right">Admired, not bought</span>
        ${dots.sort((a, b) => b.r - a.r).map(pb).join("")}<span class="ax" style="bottom:-20px;right:0">more people look →</span><span class="ax" style="left:-20px;top:50%;transform:rotate(-90deg) translateX(-50%);transform-origin:left top">more of them buy →</span></div>
        <div class="key"><span><i class="g"></i>Has sold</span><span><i class="r"></i>10+ looks, nobody tried to buy</span><span>Bigger = more sales value</span></div>`)}
      ${card("", `<div id="pDetail"></div>${more(tableHtml)}`)}`);
    document.querySelectorAll(".pb").forEach((b) => (b.onclick = () => productDetail(list.find((p) => p.id === b.dataset.p))));
    productDetail(list[0]);
  }

  // ---- visits as threads ----
  const beadOf = (s) => (FRICTION.includes(s.e) ? "bad" : s.e === "paid" ? "good" : ["checkout", "details"].includes(s.e) ? "co" : s.e === "pclick" || (s.e === "page" && s.p !== "/") ? "pr" : "");
  function renderVisits(d) {
    const shownSteps = (v) => v.steps.filter((s) => !["section", "sec", "field", "tap", "choice"].includes(s.e));
    // where one visit's time went, part by part
    const timeBar = (v) => {
      const parts = v.steps.filter((s) => (s.e === "sec" || s.e === "field") && s.n);
      if (!parts.length) return "";
      const longest = parts.reduce((a, b) => (b.n > a.n ? b : a));
      return `<div class="where">${parts.map((s) => `<i style="flex:${s.n} 1 0" data-tip="${esc(s.x)}: ${esc(dur(s.n))}"></i>`).join("")}</div><span class="sub2">Most time: ${esc(longest.x)}, ${esc(dur(longest.n))}</span>`;
    };
    const once = (v) => shownSteps(v).length <= 1;
    const F = { all: (v) => !once(v), once, stuck: (v) => v.friction, bought: (v) => v.value || v.outcome === "Paid", left: (v) => v.outcome === "Left checkout" };
    const gone = d.visits.filter(once).length;
    const list = d.visits.filter(F[state.visitFilter]);
    const row = (v) => { const shown = shownSteps(v); return `<div class="tw"><div class="thr" data-open="${esc(v.s)}" role="button" tabindex="0" data-tip="${esc(v.source)}, ${esc(v.device)}: ${esc(v.outcome)}"><time>${esc(clock(v.start))}</time><div class="beads">${shown.slice(0, 40).map((s) => `<i class="${beadOf(s)}"></i>`).join("")}</div></div>
      <div class="vd hide" id="j-${esc(v.s)}"><span class="sub2">${esc(stamp(v.start))} · ${esc(v.source)} · ${esc(v.device)}${v.returning ? " · returning" : ""} · ${esc(dur(v.engaged))} · ${esc(v.outcome)}</span>${timeBar(v)}<ol class="journey">${v.steps.filter((s) => s.e !== "section").map((s) => `<li class="${tone(s.e)}"><time>${clock(s.t)}</time>${esc((WORD[s.e] || (() => s.e))(s))}</li>`).join("")}</ol></div></div>`; };
    $("v-visits").innerHTML = card("Every visit is a thread", `
      <div class="chips" style="margin-bottom:10px">${[["all", "All"], ["stuck", "Got stuck"], ["left", "Left checkout"], ["bought", "Bought"], ["once", "Left at once"]].map(([k, l]) => `<button type="button" data-vf="${k}" class="${state.visitFilter === k ? "on" : ""}">${l}</button>`).join("")}</div>
      <div class="key" style="margin:0 0 8px"><span><i style="background:var(--neutral)"></i>Looking around</span><span><i></i>A product</span><span><i style="border-radius:2px"></i>Checkout</span><span><i class="r" style="border-radius:2px"></i>Stuck</span><span><i class="g"></i>Bought</span></div>
      ${state.visitFilter === "all" && gone ? `<p class="sub2" style="margin:0 0 8px">${num(gone)} more opened one page and left.</p>` : ""}
      ${list.length ? `<div class="thrs">${list.map(row).join("")}</div>` : `<p class="empty">No visits match.</p>`}${d.visits.length >= 200 ? `<p class="sub2">From the latest 200 visits in these dates.</p>` : ""}`);
    $("v-visits").querySelectorAll("[data-vf]").forEach((b) => (b.onclick = () => { state.visitFilter = b.dataset.vf; renderVisits(d); }));
    $("v-visits").querySelectorAll("[data-open]").forEach((tr) => { tr.onclick = () => $(`j-${tr.dataset.open}`).classList.toggle("hide"); tr.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tr.click(); } }; });
  }

  // ---- page control ----
  const state = { view: "now", from: today(), to: today(), data: null, visitFilter: "all", formKind: "checkout", seg: "", took: 0 };
  const segQ = () => (state.seg ? `&seg=${encodeURIComponent(state.seg)}` : "");
  const RENDER = { pred: renderPred, fix: renderFix, loop: renderLoop, form: renderForm, traffic: renderTraffic, behave: renderBehave, products: renderProducts, visits: renderVisits };
  function show(v) {
    state.view = v;
    document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.v === v));
    document.querySelectorAll("section.view").forEach((s) => s.classList.toggle("on", s.id === `v-${v}`));
    store.set("vx-an-view", v);
    water.on = v === "now" && water.on;
    if (v === "now") { ensureFloor(); sizeWater(); startWater(); tick(); if (state.data) { setProducts(state.data.products); timesFrom(state.data); renderRoom(); } else loadReport(); } else if (state.data) RENDER[v](state.data); else loadReport();
  }
  $("tabs").onclick = (e) => { const b = e.target.closest("button"); if (b) show(b.dataset.v); };
  function setRange(from, to) {
    state.from = from; state.to = to; $("from").value = from; $("to").value = to;
    const span = Math.round((Date.parse(to) - Date.parse(from)) / 864e5);
    document.querySelectorAll("#range button").forEach((b) => b.classList.toggle("on", to === today() && Number(b.dataset.d) === span));
    state.data = null; store.set("vx-an-span", to === today() ? String(span) : "0");
    loadReport();
  }
  $("seg").onchange = () => { state.seg = $("seg").value; state.data = null; openRoomQuiet(); loadReport(); tick(); };
  const openRoomQuiet = () => { if (water.mode === "all" || water.mode === "replay") goLive(); };
  $("range").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setRange(shift(today(), -Number(b.dataset.d)), today()); });
  $("from").onchange = $("to").onchange = () => { if ($("from").value && $("to").value && $("from").value <= $("to").value) setRange($("from").value, $("to").value); };

  async function loadReport() {
    const opened = document.querySelector(".vd:not(.hide)"), asked = performance.now(), seg = state.seg;
    try {
      const d = await api(`report?from=${state.from}&to=${state.to}${segQ()}`);
      if (d.from !== state.from || d.to !== state.to || seg !== state.seg) return;
      state.data = d; state.took = performance.now() - asked;
      if (state.view === "now" && $("waterBox")) { setProducts(d.products); timesFrom(d); renderRoom(); if (water.mode === "all") showPeriod(); }
      // Don't redraw under someone reading a visit or typing a change.
      const busy = opened || document.activeElement?.closest?.("#chForm");
      if (state.view !== "now" && !busy) await RENDER[state.view](d);
    } catch (e) { if (e.message !== "key") $("dot").classList.add("off"); }
  }
  async function tick() {
    if (document.hidden) return;
    try { renderNow(await api(`live${state.seg ? `?seg=${encodeURIComponent(state.seg)}` : ""}`)); $("dot").classList.remove("off"); }
    catch (e) { if (e.message !== "key") $("dot").classList.add("off"); }
  }
  let started = false, lastReport = Date.now();
  function boot() {
    store.set("vx-no-track", "1"); // the owner's own browsing shouldn't count as a customer
    const was = store.get("vx-an-view");
    setRange(shift(today(), -Number(store.get("vx-an-span") || 6)), today());
    show(was && $(`v-${was}`) ? was : "now");
    if (started) return;
    started = true;
    setInterval(tick, 3000);
    // A big report refreshes less often, so the numbers stay fresh without working the server hard.
    setInterval(() => { if (!document.hidden && Date.now() - lastReport > Math.max(30000, state.took * 12)) { lastReport = Date.now(); loadReport(); } }, 5000);
    document.addEventListener("visibilitychange", tick);
  }
  boot();
})();
</script>
</body>
</html>
