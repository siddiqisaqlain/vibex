<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Vibe X Labels</title>
<style>
  body{margin:0;background:#f3f1ec;color:#111;font:13px/1.25 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .bar{padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  button,select{font:inherit;padding:8px 12px;border:1px solid #111;border-radius:8px;background:#fff}
  button{background:#111;color:#fff;font-weight:600;cursor:pointer}
  #sheet{display:flex;flex-wrap:wrap;gap:4mm;padding:0 16px 16px}
  .label{background:#fff;width:50mm;height:30mm;box-sizing:border-box;padding:1.5mm 2mm;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;page-break-inside:avoid}
  .label.small{width:38mm;height:25mm}
  .name{font-weight:700;font-size:9pt;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .label svg{width:100%;height:11mm;display:block}
  .code{text-align:center;font-size:7pt;letter-spacing:.04em}
  .price{display:flex;justify-content:space-between;font-size:8pt}.price b{font-size:10pt}
  @media print{body{background:#fff}.bar{display:none}#sheet{padding:0;gap:2mm}@page{margin:4mm}}
</style></head><body>
<div class="bar"><button onclick="print()">Print labels</button><label>Size <select id="size"><option value="">50 × 30 mm</option><option value="small">38 × 25 mm</option></select></label><span id="msg"></span></div>
<div id="sheet"></div>
<script src="/billing-code128.js"></script>
<script>
(async () => {
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let key = "", session = "";
  try { key = localStorage.getItem("vx-owner-key") || ""; session = localStorage.getItem("vx-session") || ""; } catch {}
  const want = new URLSearchParams(location.search).get("items") || "";
  const r = await fetch("/api/billing/products", { headers: { "x-owner-key": key, "x-session": session } });
  if (!r.ok) { document.getElementById("msg").textContent = "Open billing first, then print labels from the Stock tab."; return; }
  const items = await r.json();
  const list = want.split(",").map((x) => x.split(":")).map(([id, n]) => ({ p: items.find((x) => x.id === id), n: Math.min(200, Number(n) || 1) })).filter((x) => x.p && x.p.barcode);
  const one = (p) => `<div class="label"><div class="name">${esc(p.name)}</div>${window.code128(p.barcode)}<div class="code">${esc(p.barcode)}</div><div class="price"><span>${p.mrp ? "MRP ₹" + Number(p.mrp).toLocaleString("en-IN") : esc(p.sizes || "")}</span><b>₹${Number(p.price || 0).toLocaleString("en-IN")}</b></div></div>`;
  document.getElementById("sheet").innerHTML = list.flatMap(({ p, n }) => Array(n).fill(one(p))).join("");
  document.getElementById("size").onchange = (e) => document.querySelectorAll(".label").forEach((l) => l.classList.toggle("small", e.target.value === "small"));
})();
</script>
</body></html>
